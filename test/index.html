<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZigZag Replay Test</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #1e1e1e;
        color: #d1d4dc;
      }
      .controls {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 12px;
        background: #141414;
        border-bottom: 1px solid #2B2B43;
      }
      button {
        padding: 8px 16px;
        background: #26a69a;
        border: none;
        border-radius: 4px;
        color: #fff;
        cursor: pointer;
        font-size: 14px;
      }
      button:hover {
        background: #2bbbad;
      }
      button:disabled {
        background: #555;
        cursor: not-allowed;
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
      }
      input[type="range"] {
        width: 120px;
      }
      .status {
        margin-left: auto;
        font-size: 14px;
        color: #888;
      }
      #chart {
        width: 100vw;
        height: calc(100vh - 60px);
      }
    </style>
  </head>
  <body>
    <div class="controls">
      <button id="start">Start Replay</button>
      <button id="pause" disabled>Pause</button>
      <button id="reset" disabled>Reset</button>
      <label>
        Speed:
        <input type="range" id="speed" min="50" max="1000" value="300" />
        <span id="speed-value">300ms</span>
      </label>
      <div class="status">
        <span id="status">Ready - will fetch data from Binance</span>
      </div>
    </div>
    <div id="chart"></div>
    <script type="module" src="./zigzag-replay.ts"></script>
  </body>
</html>
